services:
  - type: web
    name: ctf-coach
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: COOKIE_SECURE
        value: "1"
      # La base de datos vive en Turso (gratis); Render pide estos valores al crear el servicio
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
